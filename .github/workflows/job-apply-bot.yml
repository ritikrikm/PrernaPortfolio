name: Job Apply Bot

on:
  push:
    branches:
      - job-apply-bot
    paths:
      - '.github/workflows/job-apply-bot.yml'
      - 'automation/**'

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Submit live Tucows application
        run: node automation/apply-tucows.js
