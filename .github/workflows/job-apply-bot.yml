name: Job Apply Bot

on:
  push:
    branches:
      - job-apply-bot
    paths:
      - '.github/workflows/job-apply-bot.yml'
      - 'automation/**'

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright client
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0

      - name: Verify fresh design roles in real Chrome
        run: node automation/verify-batch.js
